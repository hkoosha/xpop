[package]
name = "xpop"
version = "0.1.0"
edition = "2024"
authors = ["Koosha Hosseiny <git@koosha.io>"]
description = "An X11 pull-down application host"
homepage = "https://koosha.io/project/xpop"
license = "GPL-3.0"
readme = "README.md"
repository = "https://gitlab.com/hkoosha/xpop"

[lints.clippy]
needless_return = "allow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"

libc = "0.2"

x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
dbus = { version = "0.9", features = ["vendored"] }
