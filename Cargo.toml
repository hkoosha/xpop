[package]
name = "xpop"
version = "0.2.0"
edition = "2024"
authors = ["Koosha Hosseiny <git@koosha.io>"]
description = "An X11 pull-down application host"
homepage = "https://koosha.io/project/xpop"
license = "GPL-3.0"
readme = "README.md"
repository = "https://gitlab.com/hkoosha/xpop"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
needless_return = "allow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"

libc = "0.2"
dbus = "0.9"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "render"] } 
