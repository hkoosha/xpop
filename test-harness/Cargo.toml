[package]
name = "xpop-test-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
x11rb = { version = "0.14", features = ["render"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.clippy]
needless_return = "allow"

[[bin]]
name = "syscall-probe"
path = "src/bin/syscall_probe.rs"

[[test]]
name = "focus"
path = "tests/focus.rs"

[[test]]
name = "poll"
path = "tests/poll.rs"

[[test]]
name = "syscalls"
path = "tests/syscalls.rs"

[[test]]
name = "visual"
path = "tests/visual.rs"
